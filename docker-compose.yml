services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolmgr
      POSTGRES_USER: schoolmgr
      POSTGRES_PASSWORD: schoolmgr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://schoolmgr:schoolmgr@db:5432/schoolmgr
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
